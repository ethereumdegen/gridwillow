<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__CODEVIZ_TITLE__</title>
<!--__CODEVIZ_STYLE__-->
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="app">
  <div id="topbar"></div>
  <div id="sidebar"></div>

  <div id="stage">
    <div id="labels"></div>
    <div id="card"></div>
    <div id="nodata">
      <div class="box">
        <h1>No blueprint loaded</h1>
        <p>This is the bare template. It renders nothing until a <code>codeviz.json</code> is baked into it.</p>
        <code>node scripts/build.mjs my-repo.codeviz.json out.html</code>
        <p>The result is one self-contained HTML file — no server, no network, no dependencies. Open it straight off disk.</p>
      </div>
    </div>
  </div>

  <div id="narr">
    <div id="tabs"></div>
    <div id="narrbody"></div>
  </div>

  <div id="botbar"></div>
</div>

<!-- If the renderer never starts at all — the usual cause is opening the bare
     template from disk, where file:// blocks the relative module import — show
     the instructions rather than a blank page. -->
<script>
setTimeout(function () {
  if (!window.__codevizStarted) {
    var el = document.getElementById('nodata');
    el.classList.add('on');
    var p = document.createElement('p');
    p.className = 'err';
    p.textContent = '/ the renderer did not start — if this is template/index.html '
                  + 'opened from disk, that is expected: build a blueprint instead.';
    el.querySelector('.box').appendChild(p);
  }
}, 1500);
</script>

<script type="application/json" id="codeviz-data">__CODEVIZ_DATA__</script>

<!--__CODEVIZ_SCRIPT__-->
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<script type="module" src="./renderer.js"></script>

</body>
</html>
