[workspace]
resolver = "3"
members = ["crates/gridwillow", "crates/gridwillow-cli", "app/src-tauri"]
default-members = ["crates/gridwillow", "crates/gridwillow-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ethereumdegen/gridwillow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gridwillow = { path = "crates/gridwillow" }
